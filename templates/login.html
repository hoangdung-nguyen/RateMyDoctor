<!--allows returning users to log in
        - email/username
        - password
        - link to register page-->

{% extends "base.html" %}

{% block title %}
    Log In | Rate My Doctor
{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="doctor-card">
                <p class="text-uppercase fw-bold top-label">
                    Welcome back
                </p>

                <h1 class="h2 fw-bold mb-4">
                    Log in to your account
                </h1>

                <form method="post">
                    <div class="mb-3">
                        <label
                            class="form-label"
                            for="username"
                        >
                            Username
                        </label>

                        <input
                            class="form-control"
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label
                            class="form-label"
                            for="password"
                        >
                            Password
                        </label>

                        <input
                            class="form-control"
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        class="btn search-button w-100"
                        type="submit"
                    >
                        Log In
                    </button>
                </form>

                <p class="text-center text-secondary mt-4 mb-0">
                    Do not have an account?

                    <a href="{{ url_for('register') }}">
                        Register
                    </a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
