<!--allows users to create an account
        - name
        - email
        - password
        - confirm password
        - doctor or not (pending on verification)
            - add requirements for of specialty, location...etc.

        -->
{% extends "base.html" %}

{% block title %}
    Register | Rate My Doctor
{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="doctor-card">
                <p class="text-uppercase fw-bold top-label">
                    Create an account
                </p>

                <h1 class="h2 fw-bold mb-4">
                    Join Rate My Doctor
                </h1>

                <form method="post">
                    <div class="mb-3">
                        <label
                            class="form-label"
                            for="username"
                        >
                            Username
                        </label>

                        <input
                            class="form-control"
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label
                            class="form-label"
                            for="password"
                        >
                            Password
                        </label>

                        <input
                            class="form-control"
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label
                            class="form-label"
                            for="confirm_password"
                        >
                            Confirm password
                        </label>

                        <input
                            class="form-control"
                            id="confirm_password"
                            name="confirm_password"
                            type="password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                    </div>

                    <button
                        class="btn search-button w-100"
                        type="submit"
                    >
                        Register
                    </button>
                </form>

                <p class="text-center text-secondary mt-4 mb-0">
                    Already have an account?

                    <a href="{{ url_for('login') }}">
                        Log in
                    </a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
