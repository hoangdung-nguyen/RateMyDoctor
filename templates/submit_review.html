<!--Page for user to rate a doctor/hospital
        - star rating/number rating
        - written review
        - categories like:
                - bedside manner
                - wait time
                - communication
                - friendliness
                - overall experience
                -->
{% extends "base.html" %}

{% block title %}
    Review {{ doctor.name }} | Rate My Doctor
{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="doctor-card">
                <p class="text-uppercase fw-bold top-label">
                    Patient Review
                </p>

                <h1 class="h2 fw-bold mb-2">
                    Review {{ doctor.name }}
                </h1>

                {% if doctor.specialty %}
                    <p class="text-secondary mb-4">
                        {{ doctor.specialty }}
                    </p>
                {% endif %}

                <form method="post">
                    <div class="mb-4">
                        <label
                            class="form-label fw-semibold"
                            for="rating"
                        >
                            Rating
                        </label>

                        <select
                            class="form-select"
                            id="rating"
                            name="rating"
                            required
                        >
                            <option value="">
                                Select a rating
                            </option>

                            <option value="5">
                                5 — Excellent
                            </option>

                            <option value="4">
                                4 — Very Good
                            </option>

                            <option value="3">
                                3 — Average
                            </option>

                            <option value="2">
                                2 — Poor
                            </option>

                            <option value="1">
                                1 — Very Poor
                            </option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label
                            class="form-label fw-semibold"
                            for="body"
                        >
                            Review
                        </label>

                        <textarea
                            class="form-control"
                            id="body"
                            name="body"
                            rows="6"
                            maxlength="2000"
                            placeholder="Describe your experience with this doctor."
                            required
                        ></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button
                            class="btn search-button"
                            type="submit"
                        >
                            Submit Review
                        </button>

                        <a
                            class="btn btn-outline-secondary"
                            href="{{ url_for(
                                'doctor_profile',
                                doctor_uuid=doctor.uuid
                            ) }}"
                        >
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
